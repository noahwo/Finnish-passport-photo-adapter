<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passport Photo Generator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #17191c;
      --muted: #606873;
      --line: #d6dbe1;
      --accent: #0b66d8;
      --canvas: #25282d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --panel: #202328;
        --text: #f3f4f6;
        --muted: #a9b0bb;
        --line: #373c44;
        --accent: #73a7ff;
        --canvas: #101214;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      padding: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button,
    .file-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      min-height: 34px;
      padding: 6px 12px;
      cursor: pointer;
    }

    button.primary,
    .file-button {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.65;
    }

    input[type="file"] {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 8px 10px;
      min-height: 38px;
      color: var(--text);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 12px;
    }

    .canvas-wrap,
    .preview {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }

    .canvas-wrap {
      position: relative;
      display: grid;
    }

    canvas {
      width: 100%;
      height: 100%;
      min-height: 420px;
      display: block;
      background: var(--canvas);
      cursor: crosshair;
    }

    .preview {
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
    }

    .preview h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }

    .preview-box {
      display: grid;
      place-items: start center;
      min-height: 0;
    }

    #result {
      width: min(100%, 180px);
      aspect-ratio: 500 / 653;
      border: 1px solid var(--line);
      background: var(--canvas);
      object-fit: contain;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 760px) {
      main {
        padding: 8px;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(420px, 1fr) auto;
      }

      .preview {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto;
        align-items: start;
      }

      canvas {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <label class="file-button" for="file">Open Photo</label>
      <input id="file" type="file" accept="image/*">
      <button id="reset" type="button" disabled>Reset Clicks</button>
      <button id="download" class="primary" type="button" disabled>Download</button>
    </div>

    <div id="status" class="status">Open a portrait photo to begin.</div>

    <section class="workspace">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
      <aside class="preview">
        <h2>Passport Photo</h2>
        <div class="preview-box">
          <img id="result" alt="">
        </div>
        <div class="hint">Output size: 500 x 653 pixels</div>
      </aside>
    </section>
  </main>

  <script>
    "use strict";

    const PHOTO_WIDTH = 500;
    const PHOTO_HEIGHT = 653;
    const ABOVE_HEAD = 70;
    const HEAD_HEIGHT = 473;
    const STEPS = [
      "Open a portrait photo to begin.",
      "Click the center of one eye.",
      "Click the center of the other eye.",
      "Click the top of the head.",
      "Click the bottom of the chin."
    ];

    const fileInput = document.getElementById("file");
    const resetButton = document.getElementById("reset");
    const downloadButton = document.getElementById("download");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const resultImg = document.getElementById("result");

    let originalImage = null;
    let workingCanvas = document.createElement("canvas");
    let clicks = [];
    let eyeLeft = null;
    let eyeRight = null;
    let resultUrl = "";
    let outputName = "passport_photo.jpg";
    let view = { scale: 1, offsetX: 0, offsetY: 0 };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setStep(step) {
      setStatus(`Step ${step}/4: ${STEPS[step]}`);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = getComputedStyle(document.documentElement)
        .getPropertyValue("--canvas").trim();
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (!workingCanvas.width || !workingCanvas.height) {
        return;
      }

      const scale = Math.min(
        rect.width / workingCanvas.width,
        rect.height / workingCanvas.height
      );
      const drawWidth = workingCanvas.width * scale;
      const drawHeight = workingCanvas.height * scale;
      view = {
        scale,
        offsetX: (rect.width - drawWidth) / 2,
        offsetY: (rect.height - drawHeight) / 2
      };

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(workingCanvas, view.offsetX, view.offsetY, drawWidth, drawHeight);

      ctx.fillStyle = "#ffcc00";
      for (const point of clicks) {
        ctx.beginPath();
        ctx.arc(
          view.offsetX + point.x * view.scale,
          view.offsetY + point.y * view.scale,
          4,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }

    function canvasToImagePoint(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left - view.offsetX) / view.scale;
      const y = (event.clientY - rect.top - view.offsetY) / view.scale;

      if (
        x < 0 ||
        y < 0 ||
        x >= workingCanvas.width ||
        y >= workingCanvas.height
      ) {
        return null;
      }

      return { x, y };
    }

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          originalImage = image;
          outputName = file.name.replace(/\.[^.]+$/, "") + "_passport.jpg";
          resetWorkingImage();
          resetButton.disabled = false;
          downloadButton.disabled = true;
          resultImg.removeAttribute("src");
          setStep(1);
        };
        image.onerror = () => setStatus("Could not open the selected image.");
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function resetWorkingImage() {
      if (!originalImage) {
        return;
      }
      workingCanvas = document.createElement("canvas");
      workingCanvas.width = originalImage.naturalWidth;
      workingCanvas.height = originalImage.naturalHeight;
      const workingCtx = workingCanvas.getContext("2d");
      workingCtx.drawImage(originalImage, 0, 0);
      clicks = [];
      eyeLeft = null;
      eyeRight = null;
      resultUrl = "";
      downloadButton.disabled = true;
      resultImg.removeAttribute("src");
      setStep(1);
      draw();
    }

    function rotatePoint(point, width, height, angle) {
      const cx = width / 2;
      const cy = height / 2;
      const transform = (x, y) => {
        const dx = x - cx;
        const dy = y - cy;
        return {
          x: Math.cos(angle) * dx - Math.sin(angle) * dy,
          y: Math.sin(angle) * dx + Math.cos(angle) * dy
        };
      };
      const corners = [
        transform(0, 0),
        transform(width, 0),
        transform(0, height),
        transform(width, height)
      ];
      const minX = Math.min(...corners.map((corner) => corner.x));
      const minY = Math.min(...corners.map((corner) => corner.y));
      const rotated = transform(point.x, point.y);
      return { x: rotated.x - minX, y: rotated.y - minY };
    }

    function straightenImage() {
      eyeLeft = clicks[0];
      eyeRight = clicks[1];
      const eyeDx = eyeRight.x - eyeLeft.x;
      const eyeDy = eyeRight.y - eyeLeft.y;

      if (eyeDx === 0 && eyeDy === 0) {
        clicks.pop();
        setStatus("The two eye clicks must be different points.");
        draw();
        return false;
      }

      const angle = -Math.atan2(eyeDy, eyeDx);
      const source = workingCanvas;
      const width = source.width;
      const height = source.height;
      const sin = Math.abs(Math.sin(angle));
      const cos = Math.abs(Math.cos(angle));
      const rotatedWidth = Math.ceil(width * cos + height * sin);
      const rotatedHeight = Math.ceil(width * sin + height * cos);
      const rotatedCanvas = document.createElement("canvas");
      rotatedCanvas.width = rotatedWidth;
      rotatedCanvas.height = rotatedHeight;
      const rotatedCtx = rotatedCanvas.getContext("2d");
      rotatedCtx.imageSmoothingEnabled = true;
      rotatedCtx.imageSmoothingQuality = "high";
      rotatedCtx.translate(rotatedWidth / 2, rotatedHeight / 2);
      rotatedCtx.rotate(angle);
      rotatedCtx.drawImage(source, -width / 2, -height / 2);

      workingCanvas = rotatedCanvas;
      eyeLeft = rotatePoint(eyeLeft, width, height, angle);
      eyeRight = rotatePoint(eyeRight, width, height, angle);
      clicks = [eyeLeft, eyeRight];
      draw();
      return true;
    }

    function cropPassportPhoto() {
      const top = clicks[2];
      const bottom = clicks[3];
      const faceHeight = bottom.y - top.y;

      if (faceHeight <= 0) {
        clicks.pop();
        setStatus("The bottom of the chin must be below the top of the head.");
        draw();
        return;
      }

      const factor = HEAD_HEIGHT / faceHeight;
      const scaledCanvas = document.createElement("canvas");
      scaledCanvas.width = Math.max(1, Math.round(workingCanvas.width * factor));
      scaledCanvas.height = Math.max(1, Math.round(workingCanvas.height * factor));
      const scaledCtx = scaledCanvas.getContext("2d");
      scaledCtx.imageSmoothingEnabled = true;
      scaledCtx.imageSmoothingQuality = "high";
      scaledCtx.drawImage(workingCanvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

      const cropY = Math.round(factor * top.y - ABOVE_HEAD);
      const centerX = factor * (eyeLeft.x + eyeRight.x) / 2;
      const cropX = Math.round(centerX - PHOTO_WIDTH / 2);

      const resultCanvas = document.createElement("canvas");
      resultCanvas.width = PHOTO_WIDTH;
      resultCanvas.height = PHOTO_HEIGHT;
      const resultCtx = resultCanvas.getContext("2d");
      resultCtx.fillStyle = "white";
      resultCtx.fillRect(0, 0, PHOTO_WIDTH, PHOTO_HEIGHT);
      resultCtx.drawImage(
        scaledCanvas,
        cropX,
        cropY,
        PHOTO_WIDTH,
        PHOTO_HEIGHT,
        0,
        0,
        PHOTO_WIDTH,
        PHOTO_HEIGHT
      );

      workingCanvas = resultCanvas;
      clicks = [];
      resultUrl = resultCanvas.toDataURL("image/jpeg", 0.95);
      resultImg.src = resultUrl;
      downloadButton.disabled = false;
      setStatus("Done. Download the generated passport photo.");
      draw();
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) {
        loadImage(file);
      }
    });

    resetButton.addEventListener("click", resetWorkingImage);

    downloadButton.addEventListener("click", () => {
      if (!resultUrl) {
        return;
      }
      const link = document.createElement("a");
      link.href = resultUrl;
      link.download = outputName;
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    canvas.addEventListener("click", (event) => {
      if (!workingCanvas.width || !workingCanvas.height || resultUrl) {
        return;
      }

      const point = canvasToImagePoint(event);
      if (!point) {
        return;
      }

      clicks.push(point);
      if (clicks.length === 1) {
        setStep(2);
      } else if (clicks.length === 2) {
        if (straightenImage()) {
          setStep(3);
        }
      } else if (clicks.length === 3) {
        setStep(4);
      } else if (clicks.length === 4) {
        cropPassportPhoto();
      }
      draw();
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
